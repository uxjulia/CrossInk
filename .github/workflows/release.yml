name: Compile Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
          - environment: picco
            firmware: firmware-picco
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv.
          # Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build CrossInk
        env:
          CROSSINK_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          CROSSINK_ASSET_BASE_URL: ${{ vars.CROSSINK_ASSET_BASE_URL }}
          CROSSINK_FONT_BASE_URL: ${{ vars.CROSSINK_FONT_BASE_URL }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ needs.prepare-release.outputs.release_version }}.bin
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      - name: Generate release catalog
        run: |
          python3 scripts/generate_release_catalog.py \
            --version "${{ env.RELEASE_VERSION }}" \
            --repo "${{ github.repository }}" \
            --firmware "release-firmware/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin" \
            --firmware "release-firmware/firmware-sticky-v${{ env.RELEASE_VERSION }}.bin" \
            --firmware "release-firmware/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin" \
            --firmware "release-firmware/firmware-x4-classic-v${{ env.RELEASE_VERSION }}.bin" \
            --firmware "release-firmware/firmware-picco-v${{ env.RELEASE_VERSION }}.bin" \
            --output ".pio/build/catalog"

      - name: Package SD language files and editor template
        run: |
          python3 scripts/package_languages.py \
            --version "${{ env.RELEASE_VERSION }}" \
            --source-commit "${{ github.sha }}" --status release-build \
            --output "release-firmware/crossink-languages-${{ env.RELEASE_VERSION }}.zip" \
            --template-output-dir "release-firmware/language-template"

      - name: Publish catalog and language template to GitHub Pages source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CROSSINK_SIGNING_SSH_KEY: ${{ secrets.CROSSINK_SIGNING_SSH_KEY }}
        run: |
          if [ -z "$CROSSINK_SIGNING_SSH_KEY" ]; then
            echo "::error::CROSSINK_SIGNING_SSH_KEY is not set"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$CROSSINK_SIGNING_SSH_KEY" > ~/.ssh/crossink_actions_signing
          chmod 600 ~/.ssh/crossink_actions_signing
          ssh-keygen -y -f ~/.ssh/crossink_actions_signing > ~/.ssh/crossink_actions_signing.pub

          git config user.name "uxjulia"
          git config user.email "julia@uxj.io"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/crossink_actions_signing.pub"

          git fetch origin "$DEFAULT_BRANCH"
          git worktree add ../crossink-pages "origin/$DEFAULT_BRANCH"
          cp ".pio/build/catalog" "../crossink-pages/docs/catalog"
          mkdir -p "../crossink-pages/docs/languages/template"
          # Additive immutable translation paths keep older editor snapshots usable.
          cp -R release-firmware/language-template/. "../crossink-pages/docs/languages/template/"
          cd ../crossink-pages
          if git diff --quiet -- docs/catalog docs/languages/template && [ -z "$(git ls-files --others --exclude-standard docs/languages/template)" ]; then
            echo "Catalog and language template are already current"
            exit 0
          fi
          git add docs/catalog docs/languages/template
          git commit -S -m "Update release manifests for v${RELEASE_VERSION}"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            release-firmware/crossink-languages-${{ env.RELEASE_VERSION }}.zip
            release-firmware/language-template/english_template.yaml
            release-firmware/language-template/language-template.json
            release-firmware/firmware-x3-x4-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-sticky-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-pro-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-x4-classic-v${{ env.RELEASE_VERSION }}.bin
            release-firmware/firmware-picco-v${{ env.RELEASE_VERSION }}.bin
