name: CI (build)

on:
  push:
    branches: [main]
  pull_request:

# A newer commit supersedes older PR validation; keep main pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: $/.github/actions/setup-platformio
        with:
          cache-scope: cppcheck

      - name: Run cppcheck
        run: |
          python - check -e default --fail-on-defect low --fail-on-defect medium --fail-on-defect high <<'PY'
          from functools import cache
          from pathlib import Path
          from platformio.__main__ import main
          from platformio.check.tools.cppcheck import CppcheckCheckTool
          from platformio.package.manager.tool import ToolPackageManager

          # Keep the analyzer used by the previous ESP32 platform. The new
          # bundled analyzer needs libpcre3, unavailable on Ubuntu 26.04.
          @cache
          def cppcheck_path():
              package = ToolPackageManager().install('platformio/tool-cppcheck@~1.21100.0')
              return str(Path(package.path) / 'cppcheck')

          # Resolve the replacement after the platform prepares build metadata.
          original = CppcheckCheckTool.configure_command

          def configure_command(self, language, src_file):
              command = original(self, language, src_file)
              command[0] = cppcheck_path()
              return command

          CppcheckCheckTool.configure_command = configure_command
          raise SystemExit(main())
          PY

  build:
    # Firmware artifacts are validated on pull requests; release builds stay
    # in the dedicated release workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [default, x4-pro, eego_a4, eego_a4-debug]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: $/.github/actions/setup-platformio
        with:
          cache-scope: ${{ matrix.environment }}

      - name: Verify EEGO A4 build and release contracts
        if: matrix.environment == 'eego_a4'
        run: |
          python3 scripts/test_eego_a4_release.py
          python3 scripts/test_build_identity.py

      - name: Build ${{ matrix.environment }} firmware
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.environment }} firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
